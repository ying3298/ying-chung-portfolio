<style>
:root{
  --ink:#1E1E1E;--paper:#F0EFEA;--sheet:#D3D2CE;--tint:#E4E2DC;--rule:#1E1E1E;--mut:#5E5B57;--signal:#C8323C;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --ease:cubic-bezier(.45,0,.55,1);--pad:clamp(16px,4vw,40px)
}
@media (prefers-color-scheme:dark){:root{--ink:#F2F0EA;--paper:#121211;--sheet:#2A2926;--tint:#1F1E1C;--rule:#F2F0EA;--mut:#A8A49C;--signal:#F0625A}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);letter-spacing:-.005em;min-height:100vh;overflow-x:hidden}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.38}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--ink);color:var(--paper);padding:10px 14px;z-index:99;text-decoration:none}
.skip:focus{top:8px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.mut{color:var(--mut)}
.wrap{max-width:1280px;margin:0 auto;padding:0 var(--pad)}

/* ── hairlines that draw in ── */
.draw{background:linear-gradient(var(--rule),var(--rule)) no-repeat 0 0/0 1px;animation:draw .8s var(--ease) forwards;animation-delay:calc(var(--i,0)*40ms)}
.draw2{background:linear-gradient(var(--rule),var(--rule)) no-repeat 0 100%/0 2px;animation:draw2 .8s var(--ease) forwards}
@keyframes draw{to{background-size:100% 1px}}
@keyframes draw2{to{background-size:100% 2px}}
.fu{animation:fu .6s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes fu{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}

/* ── top bar ── */
.bar{position:sticky;top:0;z-index:20;background:var(--paper)}
.bar .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px;gap:12px}
.mark{font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.mark svg{width:22px;height:22px}
.crumb{font:12px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.crumb a{text-decoration:none;color:var(--mut)}.crumb a:hover{color:var(--ink)}
.bar-r{justify-self:end;display:flex;align-items:center;gap:18px}
.clock{font:12px/1 var(--mono);color:var(--mut);font-variant-numeric:tabular-nums}
.chip{font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:0 14px;min-height:36px;display:inline-flex;align-items:center;gap:8px}
.chip:hover{background:var(--signal)}
@media(max-width:640px){.crumb,.clock{display:none}.bar .wrap{grid-template-columns:1fr auto}}

main{outline:none;min-height:70vh}
.page{animation:fade .5s var(--ease) both}

/* ── type ── */
.giant{font-weight:600;font-size:clamp(56px,14.5vw,200px);line-height:.84;letter-spacing:-.055em;margin:0}
.h1{font-weight:500;font-size:clamp(48px,9vw,128px);line-height:.88;letter-spacing:-.05em;margin:0}
.h2{font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px}
.lede{font-size:17px;max-width:46ch;margin:0}
sup{font:11px/1 var(--mono);vertical-align:super;margin-left:4px;letter-spacing:0}
.tag{font:12px/1 var(--mono);background:var(--ink);color:var(--paper);padding:5px 8px;display:inline-block;letter-spacing:.04em}
.circ{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border:1px solid currentColor;border-radius:11px;font:11px/1 var(--mono);margin-left:8px;vertical-align:middle;letter-spacing:0}

/* ── links & buttons ── */
.btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:1px solid var(--rule);font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;transition:background .4s var(--ease),color .4s var(--ease)}
.btn:hover:not(:disabled),.btn:active:not(:disabled){background:var(--ink);color:var(--paper)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover:not(:disabled){background:var(--signal);border-color:var(--signal)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.ul{background:none;border:0;padding:0;min-height:44px;font:12px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.ul[aria-pressed=true],.ul[aria-current=true]{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.ul:hover{color:var(--signal)}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* ── flower drawing ── */
.fl{display:block;overflow:visible}
.fl .p,.fl .c{fill:var(--f);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;transform-box:fill-box;transition:fill .6s var(--ease),transform .7s var(--ease),opacity .7s var(--ease)}
.fl .p *{vector-effect:non-scaling-stroke}
.fl .st{fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.fl .d{fill:var(--paper);opacity:.55;stroke:none}
.pr{transform-origin:50% 100%}.pc{transform-origin:50% 50%}.pt{transform-origin:50% 0}
.fl.ink .p,.fl.ink .p *{fill:var(--paper)}
.fl.ink .c{fill:var(--ink)}
.colour .fl.ink .p,.colour .fl.ink .p *{fill:var(--f)}
.colour .fl.ink .c{fill:var(--f)}
.bloom .p,.bloom .c{animation:bloom .7s var(--ease) both;animation-delay:calc(var(--i,0)*24ms)}
@keyframes bloom{from{transform:scale(0) rotate(-12deg);opacity:0}}
.p.gone{transform:translateY(-38px) rotate(28deg) scale(.4);opacity:0;pointer-events:none}
.sway{animation:sway 7s var(--ease) infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}

/* ── home ── */
.hero{padding-top:clamp(20px,4vw,40px)}
.hero-top{display:flex;justify-content:space-between;gap:20px;padding-bottom:14px}
.split{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:0 4vw;padding-bottom:18px}
.split .giant:last-child{text-align:right}
.stage{position:relative;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);border-top:2px solid var(--rule);border-bottom:1px solid var(--rule);min-height:min(78vh,620px);cursor:crosshair;overflow:hidden;touch-action:manipulation}
.stage-l{border-right:1px solid var(--rule);padding:22px 22px 22px 0;display:flex;flex-direction:column;justify-content:space-between;gap:24px;cursor:auto}
.stage-r{position:relative;display:grid;place-items:center;padding:24px}
.hero-fl{width:min(78%,440px);aspect-ratio:1;position:relative;z-index:2;cursor:pointer;border-radius:50%}
.hero-fl .fl{width:100%;height:100%}
.planted{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none;z-index:1;transition:opacity 1.2s var(--ease)}
.planted.out{opacity:0}
.cap{font:12px/1.5 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.cap b{display:block;font:500 clamp(28px,4vw,44px)/1 var(--sans);letter-spacing:-.03em;text-transform:none;margin:6px 0 4px}
.cap a{text-decoration:none}.cap a:hover b{color:var(--signal)}
.hint{position:absolute;right:16px;bottom:12px;font:12px/1 var(--mono);color:var(--mut);letter-spacing:.04em;text-transform:uppercase;z-index:3}
@media(max-width:820px){.stage{grid-template-columns:1fr}.stage-l{border-right:0;border-bottom:1px solid var(--rule);padding:18px 0;order:2}.stage-r{min-height:62vw}}

/* G14-style situation rows */
.paths{list-style:none;margin:0;padding:0}
.paths a,.paths button{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;text-decoration:none;padding:18px 0;min-height:64px;transition:background .4s var(--ease),padding .4s var(--ease)}
.paths a:hover,.paths button:hover,.paths a:focus-visible,.paths button:focus-visible{background:var(--tint);padding-left:10px}
.paths .n{font:12px/1 var(--mono);color:var(--mut)}
.paths .t{font-size:clamp(20px,2.6vw,28px);letter-spacing:-.02em;line-height:1.1}
.paths .ar{font:16px/1 var(--mono);transition:transform .4s var(--ease)}

/* ── index ── */

.showing{font:12px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase}

.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.acc-body>div{overflow:hidden;min-height:0}
.acc-body.open{grid-template-rows:1fr}
.filters{padding:8px 0 20px;display:grid;gap:16px}
.frow{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding-top:10px}
.frow>span{font:12px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:36px;padding:0 12px;border:1px solid var(--rule);font:12px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;transition:background .4s var(--ease),color .4s var(--ease)}
.opt:hover{background:var(--tint)}
.opt[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.sw{width:12px;height:12px;border:1px solid var(--ink);display:inline-block;flex:none}
.field{border:0;border-bottom:1px solid var(--rule);background:transparent;padding:10px 0;min-height:44px;width:100%;max-width:420px;font-size:16px;border-radius:0}
.field:focus{outline:none;border-bottom:2px solid var(--signal)}
.ix-body{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:0 36px;border-top:2px solid var(--rule)}
.ix-body.full{grid-template-columns:1fr}
.peek{position:sticky;top:72px;align-self:start;padding:24px 0;min-height:60vh;display:flex;flex-direction:column;gap:14px}
.peek .fl{width:100%;max-width:420px;aspect-ratio:1;margin:0 auto}
@media(max-width:900px){.ix-body{grid-template-columns:1fr}.peek{display:none}}
.list{list-style:none;margin:0;padding:0}
.list a{display:grid;grid-template-columns:42px minmax(0,1fr) auto 40px;align-items:center;gap:12px;padding:10px 0;min-height:60px;text-decoration:none;transition:background .4s var(--ease),padding .4s var(--ease)}
.list a:hover,.list a:focus-visible{background:var(--tint);padding-left:8px}
.list .n{font:12px/1 var(--mono);color:var(--mut)}
.list .nm{font-size:clamp(19px,2.2vw,24px);letter-spacing:-.02em;line-height:1.1}
.list .lat{display:block;font:italic 14px/1.3 var(--serif);color:var(--mut);letter-spacing:0;margin-top:2px}
.list .rt{font:12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em;text-align:right;color:var(--mut)}
.list .th{width:40px;height:40px}
@media(max-width:560px){.list .rt{display:none}.list a{grid-template-columns:34px 1fr 40px}}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));border-left:1px solid var(--rule)}
.grid li{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.grid a{display:flex;flex-direction:column;gap:10px;padding:14px;text-decoration:none;height:100%;transition:background .4s var(--ease)}
.grid a:hover,.grid a:focus-visible{background:var(--tint)}
.grid .fl{width:100%;aspect-ratio:1;transition:transform .7s var(--ease)}
.grid a:hover .fl{transform:rotate(18deg) scale(1.04)}
.grid a:hover .fl.ink .p,.grid a:hover .fl.ink .p *,.grid a:focus-visible .fl.ink .p,.grid a:focus-visible .fl.ink .p *{fill:var(--f)}
.grid a:hover .fl.ink .c,.grid a:focus-visible .fl.ink .c{fill:var(--f)}
.grid .meta{display:flex;justify-content:space-between;font:12px/1 var(--mono);color:var(--mut)}
.grid b{font-weight:500;font-size:17px;letter-spacing:-.01em;line-height:1.15}
.strip-wrap{position:relative;padding:28px 0 8px}
.strip{display:flex;gap:28px;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px calc(50% - 90px);scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip a{flex:0 0 180px;scroll-snap-align:center;text-decoration:none;opacity:.45;transition:opacity .5s var(--ease)}
.strip a.on{opacity:1}
.strip .fl{width:180px;height:180px}
.brk{position:absolute;top:28px;bottom:8px;left:50%;width:236px;margin-left:-118px;pointer-events:none;display:flex;justify-content:space-between}
.brk i{width:22px;border:2px solid var(--ink);border-right:0;border-radius:110px 0 0 110px}
.brk i+i{border:2px solid var(--ink);border-left:0;border-radius:0 110px 110px 0}
.strip-cap{text-align:center;padding:10px 0 28px;min-height:120px}
.strip-cap b{display:block;font:500 clamp(28px,4vw,44px)/1 var(--sans);letter-spacing:-.03em}
.empty{padding:56px 0;display:grid;gap:16px;justify-items:start}
.empty p{font-size:clamp(22px,3vw,32px);letter-spacing:-.02em;line-height:1.15;margin:0;max-width:22ch}

/* ── detail ── */
.det{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:0 40px;border-top:2px solid var(--rule)}
.det-fig{position:sticky;top:56px;align-self:start;padding:24px 0;display:flex;flex-direction:column;gap:14px}
.spinner{width:100%;aspect-ratio:1;max-width:520px;margin:0 auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.spinner:active{cursor:grabbing}
.spinner>div{width:100%;height:100%;transition:transform .7s var(--ease)}
.spinner .fl{width:100%;height:100%}
.spinner .p{cursor:pointer}
.status{font:12px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.04em;min-height:20px;text-align:center}
.status b{color:var(--signal);font-weight:600}
.det-text{padding:28px 0 40px}
.det-text .latin{font:italic clamp(18px,2vw,22px)/1.3 var(--serif);color:var(--mut);margin:12px 0 22px}
dl{margin:0}
.row{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0}
.row dt{font:12px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.04em}
.row dd{margin:0}
.acc{border-bottom:1px solid var(--rule);margin-top:24px}
.acc-h{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;min-height:56px;padding:12px 0;font-size:clamp(18px,2vw,22px);letter-spacing:-.015em}
.acc-h:hover{color:var(--signal)}
.acc-h .pl{font:300 26px/1 var(--sans);transition:transform .6s var(--ease);display:inline-block}
.acc-h[aria-expanded=true] .pl{transform:rotate(45deg)}
.acc-in{padding:0 0 18px;max-width:56ch}
.acc-in p{margin:0 0 10px}
.alike{display:flex;flex-wrap:wrap;gap:6px}
.pn{display:grid;grid-template-columns:1fr 1fr;margin-top:32px;border-top:1px solid var(--rule)}
.pn a{text-decoration:none;padding:16px 0;min-height:64px;display:flex;flex-direction:column;gap:6px}
.pn a+a{text-align:right;border-left:1px solid var(--rule);padding-left:16px}
.pn a:hover b{color:var(--signal)}
.pn b{font-weight:500;font-size:20px;letter-spacing:-.02em}
@media(max-width:820px){.det{grid-template-columns:1fr}.det-fig{position:static}}

/* ── play: horizontal accordion ── */
.hz{display:flex;border-top:2px solid var(--rule);border-bottom:1px solid var(--rule);min-height:640px}
.hz-i{display:flex;flex:0 0 72px;border-right:1px solid var(--rule);transition:flex .7s var(--ease);min-width:0}
.hz-i:last-child{border-right:0}
.hz-i.open{flex:1 1 auto}
.spine{flex:0 0 72px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 0;gap:18px;border-right:1px solid transparent;transition:background .4s var(--ease)}
.spine:hover{background:var(--tint)}
.hz-i.open .spine{border-right-color:var(--rule)}
.spine .n{font:500 34px/1 var(--sans);letter-spacing:-.04em}
.hz-i.open .spine .n{color:var(--signal)}
.spine .lbl{writing-mode:vertical-rl;transform:rotate(180deg);font:12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.pane{flex:1;min-width:0;padding:24px clamp(16px,3vw,36px) 32px;overflow:hidden}
.pane[hidden]{display:none}
.pane-in{animation:fu .6s var(--ease) both;animation-delay:.2s;max-width:860px}
@media(max-width:820px){.hz{flex-direction:column;min-height:0;border-bottom:0}.hz-i{flex:none;flex-direction:column;border-right:0;border-bottom:1px solid var(--rule)}.hz-i.open{flex:none}.spine{flex-direction:row;justify-content:flex-start;padding:14px 0;min-height:64px;border-right:0}.spine .lbl{writing-mode:horizontal-tb;transform:none;font-size:13px}.spine .n{font-size:26px;width:44px}.pane{padding:6px 0 28px}}
.qa{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:28px;align-items:start}
.qa .fl{width:100%;max-width:360px;aspect-ratio:1;margin:0 auto}
@media(max-width:820px){.qa{grid-template-columns:1fr}}
.choices{list-style:none;margin:0;padding:0}
.choices button{display:grid;grid-template-columns:44px 1fr auto;align-items:center;width:100%;text-align:left;min-height:56px;padding:12px 0;font-size:20px;letter-spacing:-.015em;transition:background .4s var(--ease),padding .4s var(--ease)}
.choices button:hover:not(:disabled){background:var(--tint);padding-left:8px}
.choices .n{font:12px/1 var(--mono);color:var(--mut)}
.choices button.right{color:var(--signal)}
.choices button.right .mk::after{content:"✓ Correct"}
.choices button.wrong{text-decoration:line-through}
.choices button.wrong .mk::after{content:"✕"}
.choices button:disabled{opacity:1;cursor:default}
.choices .mk{font:12px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em}
.score{display:flex;gap:24px;font:12px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;margin:0 0 16px}
.score b{font:500 28px/1 var(--sans);letter-spacing:-.03em;display:block;margin-top:6px}
.bq{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:28px}
.bq-pick{display:flex;flex-wrap:wrap;gap:6px;max-height:340px;overflow:auto;padding:2px}
.bq-fig .fl{width:100%;max-width:400px;aspect-ratio:1/1.1;margin:0 auto}
@media(max-width:820px){.bq{grid-template-columns:1fr}.bq-fig{order:-1}}

/* ── garden ── */
.bqs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
.bqs li{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:8px}
.bqs .fl{width:100%;aspect-ratio:1/1.1}
.bqs b{font-weight:500;font-size:18px}
.saved li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
.saved li a{grid-template-columns:42px minmax(0,1fr) 40px}

/* ── switch ── */
.sw-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:14px 0;min-height:64px}
.sw-row small{display:block;color:var(--mut);font-size:14px}
.switch{width:52px;height:30px;border:1px solid var(--rule);position:relative;flex:none;transition:background .4s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:var(--ink);transition:transform .4s var(--ease),background .4s var(--ease)}
.switch[aria-checked=true]{background:var(--ink)}
.switch[aria-checked=true]::after{transform:translateX(22px);background:var(--paper)}

/* ── menu sheet ── */
.menu{position:fixed;inset:0;z-index:50;background:var(--sheet);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s}
.menu.open{opacity:1;visibility:visible;transition:opacity .5s var(--ease)}
.menu .wrap{width:100%}
.menu-top{display:flex;justify-content:space-between;align-items:center;min-height:56px}
.menu-top .lbl{font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--signal)}
.menu ol{list-style:none;margin:8px 0 0;padding:0}
.menu li{opacity:0;transform:translateY(16px);transition:opacity .5s var(--ease),transform .5s var(--ease);transition-delay:calc(var(--i)*40ms)}
.menu.open li{opacity:1;transform:none}
.menu ol a{display:flex;align-items:baseline;gap:10px;text-decoration:none;font:400 clamp(34px,7vw,72px)/1.05 var(--serif);letter-spacing:-.02em;padding:10px 0;border-bottom:1px solid var(--rule);min-height:56px}
.menu ol a sup{font-size:12px}
.menu ol a:hover{padding-left:10px;transition:padding .4s var(--ease)}
.menu ol a[aria-current=page]{color:var(--signal)}
.menu-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:20px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:12px 16px;font:12px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;opacity:0;transition:opacity .5s var(--ease),transform .5s var(--ease);z-index:60;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.drift{position:fixed;width:14px;height:20px;pointer-events:none;z-index:70;animation:drift 1.6s var(--ease) forwards}
@keyframes drift{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
footer{padding:36px 0 calc(60px + env(safe-area-inset-bottom));font:12px/1.6 var(--mono);color:var(--mut);letter-spacing:.03em;text-transform:uppercase}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid var(--rule);padding-top:16px}

/* ── calm mode: crossfades only ── */
.calm *,.calm *::before,.calm *::after{transition-property:opacity,background-color,color,fill!important;scroll-behavior:auto!important}
.calm .fu,.calm .bloom .p,.calm .bloom .c,.calm .pane-in{animation-name:fade!important}
.calm .draw{animation:none;background-size:100% 1px}
.calm .draw2{animation:none;background-size:100% 2px}
.calm .sway{animation:none}
.calm .p.gone{transform:none}
.calm .drift{display:none}
.calm .menu li{transform:none}
</style>

function guessGame(p){
  let ans,opts,streak=0,answered=false;
  const round=()=>{answered=false;ans=rand(F);opts=shuffle([ans,...shuffle(F.filter(x=>x!==ans)).slice(0,3)]);
    p.innerHTML=`<div class="pane-in"><div class="score"><span>Streak<b id="stk">${streak}</b></span><span>Best<b>${S.best}</b></span></div><div class="qa"><div id="gfig">${flowerSVG(ans,{ink:true,bloom:true,label:false})}</div><div><h2 style="font-weight:500;font-size:clamp(24px,3vw,34px);letter-spacing:-.03em;margin:0 0 6px;line-height:1.1">Which flower is this?</h2><p class="mut" style="margin:0 0 14px">The colour arrives when you answer.</p><ol class="choices">${opts.map((o,k)=>`<li class="draw" style="--i:${k}"><button data-s="${o.slug}"><span class="n">${pad(k+1)}</span><span>${esc(o.name)}</span><span class="mk"></span></button></li>`).join('')}</ol><div id="after" style="margin-top:16px;min-height:52px"></div></div></div></div>`;
    $$('.choices button',p).forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=b.dataset.s===ans.slug;$$('.choices button',p).forEach(x=>{x.disabled=true;if(x.dataset.s===ans.slug)x.classList.add('right')});if(!ok)b.classList.add('wrong');
      $('#gfig .fl',p).classList.remove('ink');streak=ok?streak+1:0;if(streak>S.best){S.best=streak;store.set('best',S.best)}$('#stk',p).textContent=streak;
      $('#after',p).innerHTML=`<p style="margin:0 0 12px">${ok?'Yes!':'Not quite.'} It’s the <a href="#/f/${ans.slug}">${esc(ans.name.toLowerCase())}</a>. ${esc(ans.fact)}</p><button class="btn solid" id="again">Next bloom →</button>`;say(ok?`Correct, ${ans.name}. Streak ${streak}`:`Not quite. It was ${ans.name}`);if(ok)drift(b,ans.hex);$('#again',p).onclick=round;$('#again',p).focus()})};
  round();
}
function bouquetGame(p,params){
  const MAX=7;let pick=[];const w=params&&params.get('with');if(w&&BY[w])pick=[w];
  p.innerHTML=`<div class="pane-in"><div class="bq"><div><h2 style="font-weight:500;font-size:clamp(24px,3vw,34px);letter-spacing:-.03em;margin:0 0 6px;line-height:1.1">Pick up to seven</h2><p class="mut" style="margin:0 0 14px" id="bqc" aria-live="polite"></p><div class="bq-pick" role="group" aria-label="Flowers">${F.map(f=>`<button class="opt" data-s="${f.slug}" aria-pressed="false"><i class="sw" style="background:${f.hex}"></i>${esc(f.name)}</button>`).join('')}</div>
  <label class="frow" style="grid-template-columns:110px 1fr;margin-top:14px"><span>Name it</span><input class="field" id="bqn" maxlength="40" placeholder="Sunday table"></label>
  <div class="btns" style="margin-top:16px"><button class="btn solid" id="bqs">Save to garden</button><button class="btn" id="bqr">Random seven</button><button class="btn" id="bqx">Clear</button></div></div><div class="bq-fig" id="bqf"></div></div></div>`;
  const draw=()=>{const fs=pick.map(s=>BY[s]);$('#bqf',p).innerHTML=bouquetSVG(fs,$('#bqn',p).value||'Bouquet');$('#bqc',p).textContent=pick.length?`${pick.length} of ${MAX} chosen${pick.length===MAX?' · bouquet is full':''}`:'Nothing chosen yet. Tap names to add them.';
    $$('.bq-pick .opt',p).forEach(b=>{const on=pick.includes(b.dataset.s);b.setAttribute('aria-pressed',on);b.disabled=!on&&pick.length>=MAX});$('#bqs',p).disabled=!pick.length;$('#bqx',p).disabled=!pick.length};
  $$('.bq-pick .opt',p).forEach(b=>b.onclick=()=>{const s=b.dataset.s;pick=pick.includes(s)?pick.filter(x=>x!==s):[...pick,s].slice(0,MAX);draw()});
  $('#bqn',p).addEventListener('input',draw);
  $('#bqr',p).onclick=()=>{pick=shuffle(F).slice(0,MAX).map(f=>f.slug);draw();say('Seven random flowers chosen')};
  $('#bqx',p).onclick=()=>{pick=[];draw()};
  $('#bqs',p).onclick=e=>{const name=$('#bqn',p).value.trim()||`Bouquet ${S.bouquets.length+1}`;S.bouquets=[{id:Date.now(),name,slugs:pick.slice(),date:new Date().toISOString()},...S.bouquets];store.set('bouquets',S.bouquets);drift(e.currentTarget,BY[pick[0]].hex);toast(`“${name}” saved to your garden`);renderMenu();pick=[];$('#bqn',p).value='';draw()};
  draw();
}
function quizGame(p){
  let step=0,ans=[];
  const show=()=>{if(step>=QUIZ.length)return result();const Q=QUIZ[step];
    p.innerHTML=`<div class="pane-in"><p class="mono mut" style="margin:0 0 10px">Question ${step+1} of ${QUIZ.length}</p><h2 style="font-weight:500;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.03em;margin:0 0 16px;line-height:1.05">${Q.q}</h2><ol class="choices">${Q.a.map(([t],k)=>`<li class="draw" style="--i:${k}"><button data-k="${k}"><span class="n">${pad(k+1)}</span><span>${t}</span><span class="mk" aria-hidden="true">→</span></button></li>`).join('')}</ol><div class="btns" style="margin-top:16px"><button class="btn" id="qb" ${step?'':'disabled'}>← Back</button></div></div>`;
    $$('.choices button',p).forEach(b=>b.onclick=()=>{ans[step]=Q.a[+b.dataset.k][1];step++;show();$('.choices button,#again',p)?.focus()});
    $('#qb',p).onclick=()=>{step--;show()}};
  const result=()=>{const [se,co,sh]=ans;let best=null,bs=-1;const seed=ans.join('').length;
    F.forEach((f,k)=>{const sc=(f.season===se?2:0)+(co.split('|').includes(f.colour)?2:0)+(sh.split('|').includes(f.shape)?1.5:0)+((k*7+seed)%11)/100;if(sc>bs){bs=sc;best=f}});
    const why=[best.season===se&&`blooms in ${se.toLowerCase()}`,co.split('|').includes(best.colour)&&`wears ${best.colour}`].filter(Boolean);
    p.innerHTML=`<div class="pane-in"><div class="qa"><div>${flowerSVG(best,{bloom:true})}</div><div><p class="mono mut" style="margin:0 0 8px">You are the</p><h2 class="h1" style="font-size:clamp(44px,7vw,88px)">${esc(best.name)}</h2><p class="latin" style="font:italic 18px var(--serif);color:var(--mut);margin:10px 0 16px">${esc(best.latin)}</p><p style="font-size:19px;margin:0 0 18px;max-width:40ch">It means “${esc(best.meaning.toLowerCase())}”${why.length?` and, like you, it ${why.join(' and ')}`:''}.</p><div class="btns"><a class="btn solid" href="#/f/${best.slug}">Meet your flower →</a><button class="btn" id="qs" aria-pressed="${inGarden(best.slug)}">${inGarden(best.slug)?'♥ Saved':'♡ Save'}</button><button class="btn" id="again">Take it again</button></div></div></div></div>`;
    say(`You are the ${best.name}`);drift($('.qa',p),best.hex);
    $('#again',p).onclick=()=>{step=0;ans=[];show()};
    $('#qs',p).onclick=e=>{const on=toggleGarden(best.slug,e.currentTarget);e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'♥ Saved':'♡ Save'}};
  show();
}

/* ═════════ GARDEN ═════════ */
function garden(){
  const g=S.garden.filter(s=>BY[s]).map(s=>BY[s]),b=S.bouquets;
  const html=`<section class="wrap"><div class="ix-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap"><h1 class="h1 fu">Garden<sup>${g.length+b.length}</sup></h1><div id="clr"></div></div>
  <section class="sec" style="border-top:2px solid var(--rule);padding-top:18px" aria-labelledby="gs"><div class="sec-head"><h2 class="h2" id="gs">Saved flowers <span class="circ">${g.length}</span></h2></div>
  ${g.length?`<ol class="list saved">${g.map((f,k)=>`<li class="draw" style="--i:${k}"><a href="#/f/${f.slug}"><span class="n">${pad(f.n)}</span><span><span class="nm">${esc(f.name)}</span><span class="lat">${esc(f.latin)}</span></span><span class="th">${flowerSVG(f,{label:false})}</span></a><button class="ul" data-rm="${f.slug}" aria-label="Remove ${esc(f.name)}">Remove</button></li>`).join('')}</ol>`:`<div class="empty" style="padding:28px 0"><p>Nothing planted yet.</p><span class="mut">Tap ♡ Save on any flower and it will grow here.</span><a class="btn solid" href="#/index">Browse the index →</a></div>`}</section>
  <section class="sec" style="border-top:1px solid var(--rule);padding-top:18px" aria-labelledby="gb"><div class="sec-head"><h2 class="h2" id="gb">Bouquets <span class="circ">${b.length}</span></h2></div>
  ${b.length?`<ul class="bqs">${b.map(x=>{const fs=x.slugs.filter(s=>BY[s]).map(s=>BY[s]);return `<li>${bouquetSVG(fs,x.name)}<b>${esc(x.name)}</b><span class="mono mut">${fs.length} flowers · ${new Date(x.date).toLocaleDateString()}</span><span class="mut" style="font-size:14px">${esc(fs.map(f=>f.name).join(', '))}</span><button class="ul" data-rmb="${x.id}" aria-label="Delete bouquet ${esc(x.name)}">Delete</button></li>`}).join('')}</ul>`:`<div class="empty" style="padding:28px 0"><p>No bouquets yet.</p><a class="btn" href="#/play/bouquet">Make a bouquet →</a></div>`}</section></section>`;
  return {html,bind(app){
    $$('[data-rm]',app).forEach(x=>x.onclick=()=>{toggleGarden(x.dataset.rm);route()});
    $$('[data-rmb]',app).forEach(x=>x.onclick=()=>{S.bouquets=S.bouquets.filter(q=>String(q.id)!==x.dataset.rmb);store.set('bouquets',S.bouquets);toast('Bouquet deleted');route()});
    const clr=$('#clr',app);if(g.length+b.length){const base=()=>{clr.innerHTML='<button class="btn" id="c1">Clear garden</button>';$('#c1').onclick=()=>{clr.innerHTML='<div class="btns"><span class="mono" style="align-self:center">Clear everything?</span><button class="btn solid" id="c2">Yes, clear</button><button class="btn" id="c3">Keep it</button></div>';$('#c3').focus();$('#c3').onclick=base;$('#c2').onclick=()=>{S.garden=[];S.bouquets=[];store.set('garden',[]);store.set('bouquets',[]);toast('Garden cleared');route()}}};base()}
  }}
}

/* ═════════ ABOUT ═════════ */
function about(){
  const sw=(id,t,d,on)=>`<div class="sw-row draw"><div><span id="${id}-l">${t}</span><small>${d}</small></div><button class="switch" role="switch" id="${id}" aria-checked="${on}" aria-labelledby="${id}-l"></button></div>`;
  const html=`<section class="wrap"><div class="ix-head"><h1 class="h1 fu">About</h1></div>
  <div class="det" style="padding-top:8px"><div class="det-text" style="padding-top:20px"><p style="font-size:clamp(22px,2.8vw,30px);letter-spacing:-.02em;line-height:1.2;margin:0 0 20px;max-width:30ch">Fifty Flowers is a field guide you can touch. Every drawing is made in code from the flower’s own numbers, so no two visits bloom quite the same.</p>
  <dl>${[['Made of','One page of HTML, CSS and JavaScript. Works offline once installed.'],['Drawings','Generated from petal count, shape and colour. Not botanical illustrations.'],['Facts','Common botanical and cultural facts. Spot an error? Tell us and we will fix it.'],['Your data','Saved flowers, bouquets and settings stay on this device only.']].map(([k,v])=>`<div class="row draw"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl></div>
  <div class="det-text" style="padding-top:20px"><h2 class="h2">Settings</h2>
  ${sw('sCalm','Calm motion','Crossfades only. Follows your device setting until you change it here.',isCalm())}
  ${sw('sColour','Colour everywhere','Show flowers in colour in the index, not just outlines.',!!S.prefs.colour)}
  ${sw('sCycle','Changing flower on Home','A new flower every three seconds. You can also pause it on Home.',!!S.prefs.cycle)}
  <h2 class="h2" style="margin-top:28px">Keyboard</h2><dl>${[['Tab','Move between links and buttons'],['Enter / Space','Open, pluck, choose'],['Shift + ← →','Previous / next flower on a flower page'],['← →','Move through the strip view'],['Esc','Close the menu']].map(([k,v])=>`<div class="row draw"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl></div></div></section>`;
  return {html,bind(){
    const t=(id,fn)=>{const b=$('#'+id);b.onclick=()=>{const on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on);fn(on);savePrefs()}};
    t('sCalm',on=>S.prefs.calm=on);t('sColour',on=>S.prefs.colour=on);t('sCycle',on=>S.prefs.cycle=on);
  }}
}
function notFound(){return {html:`<section class="wrap"><div class="empty"><h1 class="h1">Not found</h1><p>This page has wilted. The other fifty are still here.</p><div class="btns"><a class="btn solid" href="#/index">Go to the index →</a><a class="btn" href="#/">Home</a></div></div></section>`}}

/* ═════════ MENU ═════════ */
let lastFocus=null;
function renderMenu(){const cur='#/'+(location.hash.replace(/^#\/?/,'').split(/[/?]/)[0]||'');
  $('#menuList').innerHTML=NAV.map(([n,t,u,c],k)=>{const active=(u==='#/'?cur==='#/':cur.startsWith(u))||(u==='#/index'&&cur==='#/f');return `<li style="--i:${k}"><a href="${u}" ${active?'aria-current="page"':''}><sup>${n}</sup>${t}${c?`<span class="circ" aria-label="${c()} items">${c()}</span>`:''}</a></li>`}).join('')}
function openMenu(){lastFocus=document.activeElement;const m=$('#menu');m.classList.add('open');$('#menuBtn').setAttribute('aria-expanded','true');document.body.style.overflow='hidden';$('#app').inert=true;setTimeout(()=>$('#menuClose').focus(),60)}
function closeMenu(restore=true){const m=$('#menu');if(!m.classList.contains('open'))return;m.classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');document.body.style.overflow='';$('#app').inert=false;if(restore&&lastFocus)lastFocus.focus()}
$('#menuBtn').onclick=openMenu;$('#menuClose').onclick=()=>closeMenu();
$('#menuRandom').onclick=()=>{location.hash='#/f/'+rand(F).slug};
$('#menuList').addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.getAttribute('href')===location.hash)closeMenu()});
document.addEventListener('keydown',e=>{const m=$('#menu');if(!m.classList.contains('open'))return;if(e.key==='Escape'){e.preventDefault();closeMenu()}if(e.key==='Tab'){const f=$$('button,a',m),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

/* ═════════ BOOT ═════════ */
const tick=()=>{const t=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#clock').textContent='Local '+t;$('#menuTime').textContent='Local time '+t};
tick();setInterval(tick,1000);
let mi=0;const markF=[BY['daisy'],BY['poppy'],BY['cosmos'],BY['forget-me-not'],BY['cherry-blossom']];const markTick=()=>{$('#markfl').innerHTML=drawInner(markF[mi++%markF.length])};markTick();setInterval(()=>{if(!isCalm())markTick()},4000);
applyPrefs();
addEventListener('hashchange',route);route();

</script>
</body>
